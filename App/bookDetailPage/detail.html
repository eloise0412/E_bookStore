<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/App/bookDetailPage/detail.css">
    <title>詳情頁</title>
</head>
<body>
    
    <div id="app">

<div class="size-container">      
        <div class="header">
            <a class="return-btn" @click="returnBtn">
                <i class="fa-solid fa-chevron-left return-icon"></i>
            </a>

            <h1 class="header-title flex-center text-white tsize-16">書籍詳情</h1>

            <div class="header-space"></div>
                        
        </div>



        <div class="book-article">
            
          <div class="book-img flex-center">

          <img v-bind:src="book.cover" alt="書本圖片">

          </div>
  
          <h1 class="book-name flex-center">{{book.name}}</h1>
         
          <ul class="book-info tsize-16">
             
              <li>{{book.author}}</li>
              <li>{{book.press}}</li>
              <li>{{book.date}}</li>
              <li>{{book.translator}}</li>
              <hr>
              <li>{{book.introduction}}</li>
          </ul>
          
  
      </div>



      <div class="button-flex">

        <button
          class="wish-btn action-btn btn-reset"
          @click.stop="addToWish(book)"
          :class="{ activeHeart: isWish(book) }">
      
          <div class="btn-column">
            <i class="fa-solid fa-heart wish-icon btn-icon"></i>
            <span class="btn-text">加入心願</span>

          </div>
      
        </button>
          
            <a class="action-btn"
               @click="goBook()">
          
              <div class="btn-column">
                <i class="fa-solid fa-book-open tabar-icon"></i>
                <span>試閱</span>
              </div>
          
            </a>
          
          
            <button
              class="shoppingCart-btn action-btn btn-reset"
              @click="addToCart(book,$event)">
          
              <span 
              class="cart-badge flex-center text-white"
              v-if="cart.length > 0" >
                {{ cart.length }}
              </span>
          
              <div class="btn-column">
                <i class="fa-solid fa-cart-shopping tabar-icon"></i>
                <span>加入購物車</span>
              </div>
          
            </button>
          
          </div>

    </div>

  </div>    

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://kit.fontawesome.com/b2c49ae549.js" crossorigin="anonymous"></script>
    <script src="/App/bookDetailPage/detail.js"></script> 
</body>
</html>
