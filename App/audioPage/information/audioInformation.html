<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/App/audioPage/information/audioInformation.css">
    <title>有聲書詳情頁</title>
</head>
<body>

    <div id="app">

        <div class="header">
            <a class="return-btn" href="/App/index.html">
                <img class="return_img" src="/icon/return.png"  alt="搜尋按鈕">
            </a>
            
            <h1>書籍詳情</h1>              
        </div>



        <div class="book-article">
            
            <div class="book-cover_img">
            <img v-bind:src="book.cover" alt="書本圖片">
            </div>

            <h1 class="name">{{book.name}}</h1>
            <ul class="information">
                <hr>
                <li>{{book.author}}</li>
                <li>{{book.press}}</li>
                <li>{{book.date}}</li>
                <li>{{book.translator}}</li>
                <hr>
                <li>{{book.introduction}}</li>
            </ul>
            

            <p class="introduction-name">
       
            </p>

        </div>



        <div class="button-flex">
            <button class="wish"><img src="/icon/heart.png" alt="心願清單"></button>
            <a :href="`readingPage.html?id=${book.id}`" class="read">試閱</a>

            <button @click="addToCart(book)" class="shoppingCart">
            <span v-if="cart.length > 0" class="cart-badge"> {{ cart.length }}</span>
            <img src="/icon/grocery-store.png" alt="購物車">
            </button>
        </div>


    </div>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> 
    <script src="/App/audioPage/information/audioInformation.js"></script>
</body>
</html>
