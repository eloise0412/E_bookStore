<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書櫃</title>
    <link rel="stylesheet" href="/App/bookcase/bookcase.css">
</head>
<body>

<div id="app">
    <div class="header">
        <h1 v-show="!showSearch">書櫃</h1>

        <div class="header-search-box">
        <button class="header-searchIcon"  @click="showSearch = !showSearch">
            <i class="fa-solid fa-magnifying-glass magnifier"></i>
        </button>
        <input class="header-input-box" v-show="showSearch" type="text" v-model="keyword" placeholder="搜尋書名">
        </div>
    </div>

    <div class="bookcase-list-contain">

        <div class="case-book" v-for="(item,index) in filterBooks">
            <button class="delete_btn" @click="removeCart(index)">x</button>
            <a href="/App/readingPage/information/book-detail.html" :href="`book-detail.html?id=${item.id}`"
            @click="goDetail(item)"class="book-card__link"><img :src="item.cover">
            </a>
        </div>
    </div>

    <div class="taBar-menu">
   
        <ul class="taBar-action_menu">
            <li><a href="/App/audioPage/audioIndex.html"><i class="fa-solid fa-headphones"></i>有聲書</a></li>
            <li><a href="/App/home/index.html"><i class="fa-solid fa-book-open"></i>首頁</a></li>
        
            <li><a href="/App/checkOut/cart/shoppingCart.html">
              <span v-if="cart.length > 0" class="cart-badge"> {{ cart.length }}</span>
              <i class="fa-solid fa-cart-shopping"></i>購物車</a>
            </li>
            
            <li><a href="/App/bookcase/bookcase.html"><img src="/icon/caseW.png">書櫃</a></li>
            <li><a href="/App/member/member.html"><i class="fa-solid fa-user"></i>會員</a></li>
        </ul>
    </div>

</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> 
<script src="https://kit.fontawesome.com/b2c49ae549.js" crossorigin="anonymous"></script>
<script src="/App/bookcase/bookcase.js"></script>
</body>
</html>
