<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書櫃</title>
    <link rel="stylesheet" href="/App/bookcase/bookcase.css">
</head>
<body>

<div id="app">

    <header class="header">
    
        <div class="logo">
            logo
        </div>

        <div class="header-search">

            <input
                class="header-search-input"
                type="text"
                placeholder="搜尋書名"
                v-model="searchInput"
                @keyup.enter="search"
            >

            <button class="header-search-btn btn-reset " @click="search">
                <i class="fa-solid fa-magnifying-glass magnifier tsize-16"></i>
            </button>

        </div>

        <button class="menu-toggle btn-reset"  @click="showMenu = !showMenu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <ul class="nav-list"
        :class="{ 'menu-show': showMenu }"
        >

            <li class="nav-item">
                <a
                    class="nav-link"
                    @click="handleLogin"
                    href="/App/loginPage/login.html"
                >
                    {{ isLogin ? '登出' : '登入' }}
                </a>
            </li>

            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/App/checkOut/shoppingCart/cart.html"
                >   購物車
                    <span
                        class="cart-badge"
                        v-if="cart.length > 0"
                    >
                        ({{ cart.length }})
                    </span>
                </a>
            </li>

            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/App/bookcase/bookcase.html"
                >
                    書櫃
                </a>
            </li>

            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/App/audioPage/audioIndex/index.html"
                >
                    有聲書
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" 
                href="/App/ebookPage/index.html">
               電子書
                </a>
            </li>
        </ul>

    </header>


    
    <div v-if="isLogin">   
    <div class="bookcase-list-wrapper mt-24">

        <div class="bookcase-list" v-for="(item,index) in filterBooks">

        <button class="delete-btn btn-reset cursor" 	
            @click="removeCart(index)">x</button>

            <div class="book-link" @click="goDetail(item)">

            <img class="book-img" :src="item.cover">

            <div class="book-name">{{item.name}}</div>

            </div>

        </div>

    </div>

</div>

<div v-else>
    <h2 class="flex-center mt-24">請先登入</h2>
</div>
    

</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> 
<script src="https://kit.fontawesome.com/b2c49ae549.js" crossorigin="anonymous"></script>
<script src="/App/bookcase/bookcase.js"></script>
</body>
</html>
