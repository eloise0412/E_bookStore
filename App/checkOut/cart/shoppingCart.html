<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/App/checkOut/cart/shoppingCart.css">
    <title>購物車</title>

</head>
<body>
<div id="app">

<div class="header">
    <a class="return-btn" href="../../home/index.html"><img  src="/icon/return.png" alt="返回按鈕"></a>
    <h1>LOGO</h1>
</div>

<ul class="shoppingCart_list" >

    <li v-if="cart.length === 0" class="empty-cart">尚未加入商品</li>

    <template v-else>
    <li v-for="(item,index) in cart" class="shoppingCart_grid_contant">

    <div class="book-cover">    
    <img :src="item.cover" alt="商品圖片">
    </div>

        <h3 class="name">{{item.name}}</h3>
        
        <p  class="bookprice">NT${{item.price}}</p>
        <input class="book-amount" type="number" min="1" v-model.number="item.quantity"
        @change="saveCart">


        <button @click="removeCart(index)" class="delete_btn">
            <img class="delete_btn_img" src="/icon/garbageCan.png" alt="刪除">
        </button>
       

    </li>
    </template>
</ul>


<div class="cart_action">
    <button @click="returnBtn" id="return">繼續購物</button>
    <button @click="paymentBtn" id="buy" v-bind:disabled="cart.length === 0">前往購買</button>
</div>






</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> 
<script src="/App/checkOut/cart/shoppingCart.js"></script>
</body>
</html>
