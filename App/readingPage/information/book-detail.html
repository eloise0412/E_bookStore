<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/App/readingPage/information/book-detail.css">
    <title>詳情頁</title>
</head>
<body>
    
    <div id="app">

        
        <div class="header flex-center">
            <a class="return-btn" href="/App/home/index.html">
                <i class="fa-solid fa-chevron-left return-icon"></i>
            </a>

            <h1 class="flex-center">書籍詳情</h1>

            <div class="header-space"></div>
                        
        </div>



        <div class="book-article">
            
            <div class="book-cover-img flex-center">
            <img v-bind:src="book.cover" alt="書本圖片">
            </div>
    
            <h1 class="name flex-center">{{book.name}}</h1>
           
            <ul class="information">
               
                <li>{{book.author}}</li>
                <li>{{book.press}}</li>
                <li>{{book.date}}</li>
                <li>{{book.translator}}</li>
                <hr>
                <li>{{book.introduction}}</li>
            </ul>
            
    
        </div>



        <div class="button-flex">

            <button
              @click.stop="addToWish(book)"
              class="add-to-wish action-btn"
              :class="{ activeHeart: isWish(book) }">
          
              <div class="btn-column">
                <i class="fa-solid fa-heart"></i>
                <span>加入心願</span>
              </div>
          
            </button>
          
          
            <a
              :href="`readingPage.html?id=${book.id}`"
              class="read action-btn">
          
              <div class="btn-column">
                <i class="fa-solid fa-book-open"></i>
                <span>試閱</span>
              </div>
          
            </a>
          
          
            <button
              @click="addToCart(book,$event)"
              class="shoppingCart action-btn">
          
              <span v-if="cart.length > 0" class="cart-badge">
                {{ cart.length }}
              </span>
          
              <div class="btn-column">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>加入購物車</span>
              </div>
          
            </button>
          
          </div>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://kit.fontawesome.com/b2c49ae549.js" crossorigin="anonymous"></script>
    <script src="/App/readingPage/information/book-detail.js"></script> 
</body>
</html>
