<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/App/member/member.css">
    <title>會員頁</title>
</head>
<body>

<div id="app">
    <div class="wrap">
        
      


        <div v-if="isLogin"> 
        <div class="memberCard">
            <div class="avater">
                
            </div>
            <div class="profile-header">
                <span class="profile-header-space"></span>
                <p class="profile-info">你好</p>
                <p class="profile-info">帳號:xxxxxxxxxxxxx</p>
                <p class="profile-info">里程:xxxxxxxxxxxxx</p>
            </div>
        
    

            <div class="setting-list">
            <a class="setting-item cursor" href="/App/member/wishCart/wishCart.html" >
                心願清單 
            <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <a class="setting-item cursor" href="#">
                設定 
            <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            
            <a class="setting-item cursor" href="#">
                帳號設定
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <a class="setting-item cursor" href="#">
                常見問題
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>
            </div>

            


     <button class="action-btn flex-center btn-reset" @click="logout">登出</button>

    </div>
    </div>

    <div v-else >
        <div class="memberCard">
            <div class="avater">
                
            </div>
            <div class="profile-header">
                <span class="profile-header-space"></span>
                <p class="profile-infor">尚未登入</p>
            </div>
            <div class="setting-list">
    
                <a class="setting-item cursor" href="#">
                    設定 
                <i class="fa-solid fa-chevron-right arrow"></i>
                </a>
    
                <a class="setting-item cursor" href="#">
                    常見問題
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </a>
                </div>
    
         </div>
        <button class="action-btn flex-center mt-24 btn-reset" @click="login">立即登入</button>
    </div>
    
    
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> 
<script src="https://kit.fontawesome.com/b2c49ae549.js" crossorigin="anonymous"></script>
